<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Comment</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">
  <div class="w-full max-w-lg bg-white rounded-lg shadow-md p-6">
    <div class="space-y-4">
      <div>
        <div for="name" class="block text-gray-700 font-semibold mb-1">Name</div>
        <input
          id="name"
          type="text"
          placeholder="Enter your name"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div>
        <div for="comment" class="block text-gray-700 font-semibold mb-1">Comment</div>
        <textarea
          id="comment"
          placeholder="Write a comment"
          rows="4"
          class="w-full border border-gray-300 rounded-md px-3 py-2 resize-none focus:outline-none focus:ring-2 focus:ring-blue-500"
        ></textarea>
      </div>

      <button
        type="submit"
        class="bg-blue-600 text-white font-semibold px-6 py-2 rounded-md hover:bg-blue-700 transition"
        onclick="submitComment()"
      >
        Submit
      </button>
    </div>

    <div id="commentSection" class="mt-8">
      <h3 class="text-xl font-semibold mb-4">Comments</h3>
    </div>
  </div>
  <script src="comment.js"></script>
</body>
</html>
