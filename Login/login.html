<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="bg-white p-6 rounded-2xl shadow-md w-80">
    <h2 class="text-2xl font-bold mb-4 text-center">Login Page</h2>
    <form action="/login" method="post" class="space-y-3" onsubmit="getLoginData(event)">
      <div>
        <label for="username" class="block text-sm font-medium">Username</label>
        <input type="text" id="username" name="username" required
          class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring focus:border-blue-500">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium">Password</label>
        <input type="password" id="password" name="password" required
          class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring focus:border-blue-500">
      </div>
      <button type="submit" 
        class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700">Login</button>

      <p id="errorMessage" class="text-red-500 text-sm mt-2"></p>
    </form>

    <p class="mt-4 text-center text-sm">
      Don’t have an account?
      <a href="signup.html" class="text-blue-600 hover:underline">Sign up here</a>
    </p>
  </div>
  <script src="login.js"></script>
</body>
</html>
