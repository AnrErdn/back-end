<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="bg-white p-6 rounded-2xl shadow-md w-80">
    <h2 class="text-2xl font-bold mb-4 text-center">Sign Up Page</h2>
    <form class="space-y-3" onsubmit="getSignUpData(event)">
      <div>
        <label for="username" class="block text-sm font-medium">Username</label>
        <input type="text" id="username" name="username" required
          class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring focus:border-green-500">
      </div>
      <div>
        <label for="email" class="block text-sm font-medium">Email</label>
        <input type="email" id="email" name="email" required
          class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring focus:border-green-500">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium">Password</label>
        <input type="password" id="password" name="password" required
          class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring focus:border-green-500">
      </div>
      <div>
        <label for="confirmPassword" class="block text-sm font-medium">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required
          class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring focus:border-green-500">
      </div>
      <button type="submit" 
        class="w-full bg-green-600 text-white py-2 rounded-md hover:bg-green-700">Sign Up</button>

      <!-- Error message -->
      <p id="errorMessage" class="text-red-500 text-sm mt-2"></p>
    </form>

    <p class="mt-4 text-center text-sm">
      Already have an account?
      <a href="login.html" class="text-green-600 hover:underline">Login here</a>
    </p>
  </div>

  <script src="signup.js"></script>
</body>
</html>
