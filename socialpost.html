<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Post</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F2F2F7] flex justify-center items-center min-h-screen py-8 flex-col gap-6">

    <!-- Post Creation Section -->
    <div class="bg-white rounded-[24px] p-6 border border-[#E5E5EA] w-full max-w-[1800px] min-w-[600px] h-auto">
            <div class="flex items-center gap-3 mb-4">
                <div class="bg-[#E5E5EA] rounded-full h-[40px] w-[40px]"></div>
                <textarea class="flex-1 bg-transparent text-[16px] placeholder:text-[#6E6E73] resize-none focus:outline-none" placeholder="What's on your mind today?" rows="1"></textarea>
            </div>
            
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <button class="flex items-center gap-2 text-[#6E6E73] hover:text-[#007AFF] transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <polyline points="21,15 16,10 5,21"/>
                        </svg>
                        <span class="text-[14px]">Photo</span>
                    </button>
                </div>
                
                <button class="bg-[#007AFF] text-white text-[14px] font-medium py-2 px-6 rounded-[12px] hover:bg-[#006CE2] transition-colors">
                    Post
                </button>
            </div>
    </div>

    <!-- Post Display Section -->
    <div class="bg-white rounded-[24px] w-full max-w-[1800px] min-w-[600px] h-auto max-h-[1400px] min-h-[800px] flex flex-col p-9 gap-6 overflow-auto">
        <!-- User Info and Edit Button -->
        <div class="h-[60px] flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-[#E5E5EA] rounded-full h-[40px] w-[40px]"></div>
                <div class="flex flex-col">
                <h2 class="text-[#1D1D1F] text-[16px] font-medium">Username</h2>
                <p class="text-[#6E6E73] text-[12px]">2h ago</p>
                </div>
            </div>
            <button class="bg-[#007AFF] text-white text-[12px] font-medium py-4 px-6 rounded-[12px]">Edit</button>
        </div>  

        <!-- Image Placeholder -->
        <div class="bg-[#E5E5EA] h-[400px] rounded-[24px] text-[#6E6E73] flex items-center justify-center">
            Image
        </div>
         
        <!-- Action Buttons -->
        <div class="h-[24px] flex gap-3">
            <button>

            </button>
            <button>

            </button>
        </div>
        
        <!-- Post Content -->
        <div class="text-[#1D1D1F] text-[16px] font-normal">
            <p>Paragraph djashdjhhdasjhdjsajdhsjahdjksahdjhasdhjashdjhasdhjkaklahsdklhaskldhaklshdjkashdkhasdkhas</p>
        </div>

        <!-- Comments Section -->
        <div class="flex flex-col gap-4">
            <h3 class="text-[20px] font-medium">Comments</h3>
            <div class="bg-[#E5E5EA] rounded-[24px] p-[24px]">
                <div class="flex flex-col gap-3 bg-white rounded-[16px] p-4">
                    <div class="h-[60px] flex items-center gap-3">
                        <div class="bg-[#F2F2F7] rounded-full h-[32px] w-[32px]"></div>
                        <div class="flex flex-col">
                            <h4 class="text-[#1D1D1F] text-[14px] font-medium">Commenter</h4>
                            <p class="text-[#6E6E73] text-[10px]">1h ago</p>
                        </div>
                    </div>

                    <div class="text-[#1D1D1F] text-[14px] font-normal flex gap-2 items-center">
                        <p>Comment text goes here.</p> <p class="text-[#6E6E73] text-[10px]">(edited)</p>
                    </div>

                    <div class="flex flex-wrap gap-2">
                        <button class="bg-[#FF3B30] text-white text-[12px] hover:bg-[#DD170C] py-1 px-4 rounded-md">Delete</button>
                        <button class="bg-[#007AFF] text-white text-[12px] hover:bg-[#006CE2] py-1 px-4 rounded-md">Edit</button>
                        <button class="text-blue-500 text-[10px]">See original</button>
                    </div>
                </div>

                <di v class="flex flex-col gap-2 mt-4">
                    <h2 class="text-[#1D1D1F] text-[18px] font-medium">Write a Comment</h2>
                    <h3 class="text-[#1D1D1F] text-[14px] font-medium">Name</h3>
                    <textarea class="w-full h-12 p-3 border border-gray-300 rounded-md resize-none focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Write your name..."></textarea>
                    <h3 class="text-[#1D1D1F] text-[14px] font-medium">Comment</h3>
                    <textarea class="w-full h-24 p-3 border border-gray-300 rounded-md resize-none focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Write a new comment..."></textarea>
                </di>
            </div>
        </div>

    </div>

    <script>
        // Auto-expand textarea as user types
        const textarea = document.querySelector('textarea[placeholder*="What\'s on your mind"]');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.max(this.scrollHeight, 48) + 'px';
        });
    </script>

</body>
</html>
